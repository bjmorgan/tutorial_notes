<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physical Chemistry Tutorial Notes</title>
  <style>
    :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --card: #f6f8fa; --border: #d1d9e0; --link: #0969da; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --card: #151b23; --border: #3d444d; --link: #4493f8; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    main { max-width: 40rem; margin: 0 auto; padding: 3rem 1rem; }
    h1 { font-size: 1.6rem; margin: 0 0 0.25rem; }
    p.sub { color: var(--muted); margin: 0 0 2rem; }
    a.card { display: block; padding: 1rem 1.25rem; margin-bottom: 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--fg); text-decoration: none; }
    a.card:hover { border-color: var(--link); }
    a.card strong { display: block; color: var(--link); font-size: 1.1rem; }
    a.card span { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Physical Chemistry Tutorial Notes</h1>
    <p class="sub">University of Bath · Benjamin J. Morgan</p>
    <a class="card" href="Y1/">
      <strong>Year 1: CH12002</strong>
      <span>Y1 Physical Chemistry tutorial notes</span>
    </a>
    <a class="card" href="Y2/">
      <strong>Year 2: CH22008</strong>
      <span>Y2 Physical Chemistry tutorial notes</span>
    </a>
  </main>
</body>
</html>
